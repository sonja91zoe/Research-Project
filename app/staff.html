<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/portal.css"><title>Refund Studio · Staff</title></head><body><header><strong><span class="brand">◈</span> Refund Studio · Staff</strong><button id="refresh" class="secondary">Refresh queues</button></header><main><h1>Refund applications</h1><div id="message" role="alert"></div><div id="queues" class="queue-grid"><section class="card"><h2>Pending <span id="pendingCount"></span></h2><div id="pendingRecords"></div></section><section class="card"><h2>Completed <span id="completedCount"></span></h2><div id="completedRecords"></div></section></div><section id="reviewPanel" class="review-layout hidden"><div class="card"><button id="back" class="secondary">← Back to queues</button><h2 id="reviewTitle">Review application</h2><p id="reviewFacts"></p><p id="claimText"></p><div class="photo-comparison"><section><h3>Product photo</h3><img id="referenceImage" class="comparison-image" alt="Order product photo"><p id="referenceMissing" class="hidden">No product photo available for this order.</p></section><section><h3>Customer refund photo</h3><img id="reviewImage" class="comparison-image" alt="Customer refund application photo"></section></div><div id="evidenceHistory"></div><form id="reviewForm"><label for="reviewer">Reviewer name</label><input id="reviewer" required maxlength="2000" value="Staff"><label for="reviewNote">Review note and reason</label><textarea id="reviewNote" required maxlength="2000"></textarea><label for="reviewAction">Review action</label><select id="reviewAction"><option value="APPROVE">Approve refund</option><option value="REJECT">Decline refund</option><option value="REQUEST_MORE_EVIDENCE">Request more information</option></select><button type="submit">Save decision</button></form><details><summary>Full evidence and original assessment</summary><pre id="evidence"></pre></details></div><section id="analysisPanel" class="card" aria-label="Refund assessment analysis"></section></section><footer>Local staff workspace · Refunds do not transfer money.</footer></main><script src="/portal-common.js"></script><script src="/staff.js"></script></body></html>
