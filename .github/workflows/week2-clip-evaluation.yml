name: Week 2 CLIP evaluation

on:
  workflow_dispatch:
  push:
    branches: [student2-week5]
    paths:
      - ".github/workflows/week2-clip-evaluation.yml"

jobs:
  evaluate-member2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-vit-base-patch32-v1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify required Week 1 assets
        run: |
          test -f data/member2/week1/damage_dataset_v1.csv
          test -d data/member2/week1/images
      - name: Run free CLIP evaluation
        run: >-
          python -m src.damage_detection.evaluate
          --manifest data/member2/week1/damage_dataset_v1.csv
          --images data/member2/week1/images
          --output-dir artifacts/member2_week2
      - name: Upload predictions and metrics
        uses: actions/upload-artifact@v4
        with:
          name: member2-week2-clip-results
          path: artifacts/member2_week2
