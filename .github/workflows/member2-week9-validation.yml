name: Member 2 Week 9 validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/member2-week9-validation.yml"
      - "scripts/member2_week5_evaluate.py"
      - "scripts/member2_week9_demo.py"
      - "tests/test_member2_week5_evaluate.py"
      - "tests/test_member2_week9_refinement.py"
      - "src/damage_detection/**"
      - "data/member2/week5/**"
      - "docs/member2_week5_experiment_summary.md"
      - "docs/member2_week9_final_refinement.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Full regression suite and Week 9 demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-yolo.txt
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Run recorded Week 9 demo
        run: python -m scripts.member2_week9_demo
