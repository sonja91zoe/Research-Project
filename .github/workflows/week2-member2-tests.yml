name: Week 2 Member2 tests

on:
  push:
    branches: [student2-week5]
  pull_request:
    paths:
      - "src/common/schemas.py"
      - "src/damage_detection/**"
      - "tests/test_member2_damage.py"
      - ".github/workflows/week2-member2-tests.yml"

jobs:
  test-member2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Member 2 tests
        run: python -m unittest tests.test_member2_damage -v
