name: Week 2 YOLO training

on:
  workflow_dispatch:
  push:
    branches: [student2-week5]
    paths:
      - ".github/workflows/week2-yolo-training.yml"
      - "src/damage_detection/**"
      - "tests/test_member2_week2_yolo.py"
      - "data/member2/**"

permissions:
  contents: read

jobs:
  train-yolo:
    name: Train and validate damage detector
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-yolo.txt

      - name: Install YOLO dependencies
        run: pip install -r requirements-yolo.txt

      - name: Build curated training data
        run: >
          python scripts/create_member2_yolo_dataset.py
          --source-root data/member2
          --output-root build/member2_yolo
          --limit 512
          --seed 42

      - name: Train YOLO damage detector
        run: >
          python scripts/train_member2_yolo.py
          --dataset-yaml build/member2_yolo/dataset.yaml
          --project artifacts/member2_yolo
          --name damage_detector
          --epochs 20
          --image-size 640
          --batch 16
          --device cpu

      - name: Evaluate held-out split
        run: >
          python scripts/evaluate_member2_yolo.py
          --weights artifacts/member2_yolo/damage_detector/weights/best.pt
          --dataset-yaml build/member2_yolo/dataset.yaml
          --split val
          --output artifacts/member2_yolo/evaluation.json

      - name: Run YOLO unit tests
        run: pytest -q tests/test_member2_week2_yolo.py

      - name: Upload trained model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: member2-week2-yolo-model
          path: artifacts/member2_yolo
          if-no-files-found: error
          retention-days: 90
